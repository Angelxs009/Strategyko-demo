services:
  postgres:
    image: postgres:16-alpine
    container_name: strategyko-rates-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: strategyko
      POSTGRES_PASSWORD: strategyko
      POSTGRES_DB: strategyko_rates
    ports:
      - "55434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strategyko -d strategyko_rates"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
